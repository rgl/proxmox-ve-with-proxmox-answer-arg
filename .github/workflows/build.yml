name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: sudo ./build.sh
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            *.iso
  release:
    if: ${{ startsWith(github.event.ref, 'refs/tags/v') }}
    name: Release
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            *.iso
          token: ${{ secrets.GITHUB_TOKEN }}
